# fbadmin next to the operator-managed cluster. It is registered at startup from the ConfigMap
# below (FBADMIN_SERVERS_FILE): host = the operator's primary Service, password = the cluster's
# superuser Secret. Nothing has to be entered in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fbadmin-servers
data:
  servers.yaml: |
    servers:
      - name: fbcluster (primary)
        host: fbcluster          # Service created by the operator: <cluster name>
        port: 3050
        user: SYSDBA
        password_env: FIREBIRD_PASSWORD
        databases:
          - { name: demo, path: /var/lib/firebird/data/demo.fdb }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fbadmin
  labels: { app.kubernetes.io/name: fbadmin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: fbadmin }
  template:
    metadata:
      labels: { app.kubernetes.io/name: fbadmin }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: fbadmin
          image: ghcr.io/mariuz/fbadmin:latest
          command: ["fbadmin"]
          args: ["--no-browser", "--log-format", "json"]
          env:
            - { name: FBADMIN_HOST, value: "0.0.0.0" }
            - { name: FBADMIN_PORT, value: "5050" }
            - { name: FBADMIN_DATA_DIR, value: /data }
            - { name: FBADMIN_UPDATE_CHECK, value: "off" }
            - { name: FBADMIN_SERVERS_FILE, value: /config/servers.yaml }
            - name: FIREBIRD_PASSWORD
              valueFrom:
                secretKeyRef: { name: fbcluster-superuser, key: password }
          ports:
            - { name: http, containerPort: 5050 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: servers, mountPath: /config, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: servers
          configMap: { name: fbadmin-servers }
---
apiVersion: v1
kind: Service
metadata:
  name: fbadmin
spec:
  selector: { app.kubernetes.io/name: fbadmin }
  ports:
    - { name: http, port: 80, targetPort: http }

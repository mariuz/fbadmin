# What fbadmin's Kubernetes page (Kubernetes in the top bar, docs/KUBERNETES.md) may do with the
# operator's clusters in this namespace. Drop the verbs you don't want to offer: fbadmin shows
# Kubernetes' refusal and the rest keeps working (a read-only Role still lists the clusters).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fbadmin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fbadmin-firebird
rules:
  - apiGroups: [firebird.cloudnative-firebird.io]
    # patch: scale, hibernate, switchover, fence
    resources: [firebirdclusters]
    verbs: [get, list, patch]
  - apiGroups: [firebird.cloudnative-firebird.io]
    resources: [firebirdbackups, firebirdrestores]
    verbs: [get, list, create]
  - apiGroups: [firebird.cloudnative-firebird.io]
    resources: [firebirdscheduledbackups, firebirddatabases, firebirdusers]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]   # delete: restart one instance
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, patch]          # rolling restart
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [fbcluster-superuser]   # "Register in fbadmin" reads the SYSDBA password
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fbadmin-firebird
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fbadmin-firebird
subjects:
  - kind: ServiceAccount
    name: fbadmin

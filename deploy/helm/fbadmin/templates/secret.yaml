{{- if and .Values.serverMode.enabled (not .Values.serverMode.existingSecret) }}
{{- /* Keep generated passwords stable across upgrades by reusing the existing Secret. */}}
{{- $name := include "fbadmin.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $keys := .Values.serverMode.secretKeys }}
{{- $admin := .Values.serverMode.adminPassword }}
{{- if and (not $admin) $existing }}{{ $admin = index $existing.data $keys.adminPassword | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "fbadmin.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $keys.adminPassword }}: {{ default (randAlphaNum 24) $admin | b64enc | quote }}
{{- end }}

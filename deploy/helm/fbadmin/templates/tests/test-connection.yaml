apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fbadmin.fullname" . }}-test-connection"
  labels:
    {{- include "fbadmin.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.36
      command: ["wget", "-qO-", "http://{{ include "fbadmin.fullname" . }}:{{ .Values.service.port }}/api/health"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

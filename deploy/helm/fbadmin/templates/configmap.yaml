{{- if .Values.firebirdServers }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fbadmin.fullname" . }}-servers
  labels:
    {{- include "fbadmin.labels" . | nindent 4 }}
data:
  # read at startup through FBADMIN_SERVERS_FILE; passwords come from Secrets via environment variables
  servers.yaml: |
    servers:
    {{- range $i, $s := .Values.firebirdServers }}
      - {{- omit $s "passwordSecret" | toYaml | nindent 8 }}
        {{- if $s.passwordSecret }}
        password_env: FBADMIN_FB_PASSWORD_{{ $i }}
        {{- end }}
    {{- end }}
{{- end }}

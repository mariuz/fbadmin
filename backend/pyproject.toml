[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fbadmin"
# Single source of truth: fbadmin/__init__.py (__version__). Release tags must match it.
dynamic = ["version"]
description = "A pgAdmin-style web administration and development tool for Firebird SQL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "fbadmin contributors" }]
keywords = ["firebird", "database", "admin", "sql", "pgadmin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Database :: Front-Ends",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "firebirdsql>=1.4.5",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "hypothesis>=6.100"]
ai = ["anthropic>=1.0"]
# Optional native driver for metadata connections (FBADMIN_DRIVER=native, needs libfbclient).
native = ["firebird-driver>=1.10"]
# Native desktop window for fbadmin-desktop (falls back to the web browser without it).
desktop = ["pywebview>=5.0"]

[project.urls]
Homepage = "https://github.com/mariuz/fbadmin"
Documentation = "https://mariuz.github.io/fbadmin/"
Issues = "https://github.com/mariuz/fbadmin/issues"

[project.scripts]
fbadmin = "fbadmin.__main__:main"
fbadmin-desktop = "fbadmin.desktop:main"

[tool.setuptools.dynamic]
version = { attr = "fbadmin.__version__" }

[tool.setuptools.packages.find]
include = ["fbadmin*"]

[tool.setuptools.package-data]
fbadmin = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (property-based DDL round-trips, firebird-qa corpus)",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

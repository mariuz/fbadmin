[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbadmin"
version = "0.1.0"
description = "A pgAdmin-style web administration and development tool for Firebird SQL"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "firebirdsql>=1.4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
fbadmin = "fbadmin.__main__:main"

[tool.setuptools.packages.find]
include = ["fbadmin*"]

[tool.setuptools.package-data]
fbadmin = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

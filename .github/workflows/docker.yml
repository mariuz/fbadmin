# Multi-arch Docker image (linux/amd64 + linux/arm64) published to GitHub Container Registry:
#   ghcr.io/mariuz/fbadmin:edge          latest main
#   ghcr.io/mariuz/fbadmin:1.2.3, :1.2, :latest   release tags v1.2.3
# Pull requests build the image (both platforms) without pushing.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fbadmin
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Smoke test (amd64)
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${{ github.repository_owner }}/fbadmin:sha-${GITHUB_SHA::7}"
          docker run -d --name fbadmin -p 5050:5050 "$image"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5050/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:5050/ | grep -q '<div id="root">'
          docker inspect --format '{{.State.Health.Status}}' fbadmin || true

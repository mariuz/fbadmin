# End-to-end: deploy/k8s-operator on a kind cluster with the cloudnative-firebird operator.
# The operator creates the Firebird cluster; fbadmin registers it from its ConfigMap
# (FBADMIN_SERVERS_FILE) and is checked through its REST API: connect, DDL, data. Then the
# Kubernetes page's API (/api/kubernetes) drives the cluster: register, backup, restore, hibernate.
name: Kubernetes operator example

on:
  push:
    branches: [main]
    paths:
      - deploy/k8s-operator/**
      - backend/fbadmin/preconfig.py
      - backend/fbadmin/kube/**
      - backend/fbadmin/api/kubernetes.py
      - Dockerfile
      - .github/workflows/k8s-operator.yml
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches operator changes
  workflow_dispatch:

permissions:
  contents: read

env:
  # the operator release this example was validated with (bump deliberately)
  OPERATOR_REF: 7d192d0aec6acffe0244af79eecab38f0d0d5384

jobs:
  kind:
    name: fbadmin + cloudnative-firebird on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mariuz/cloudnative-firebird
          ref: ${{ env.OPERATOR_REF }}
          path: operator-src
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: fbadmin-e2e
      - name: Build and load the images (operator, fbadmin, Firebird)
        run: |
          docker build -t cloudnative-firebird:ci operator-src/operator
          docker build -t fbadmin:ci .
          docker pull --platform linux/amd64 firebirdsql/firebird:5
          # `kind load docker-image` fails with "content digest ... not found" for multi-platform
          # images (and builds with attestations) when Docker uses the containerd image store, as on
          # the ubuntu-26.04 runners: load single-platform archives instead
          for i in cloudnative-firebird:ci fbadmin:ci firebirdsql/firebird:5; do
            docker save --platform linux/amd64 -o "$RUNNER_TEMP/image.tar" "$i"
            kind load image-archive "$RUNNER_TEMP/image.tar" --name fbadmin-e2e
          done
      - name: Install the operator
        working-directory: operator-src
        run: |
          kubectl apply --server-side -f config/crds/
          kubectl wait --for=condition=Established crd --all --timeout=60s
          kubectl apply -f config/deploy/namespace.yaml -f config/deploy/serviceaccount.yaml -f config/deploy/rbac.yaml -f config/deploy/webhook.yaml
          sed 's|image: ghcr.io/mariuz/cloudnative-firebird:latest|image: cloudnative-firebird:ci|;s|imagePullPolicy: Always|imagePullPolicy: Never|' \
            config/deploy/deployment.yaml | kubectl apply -f -
          kubectl -n cloudnative-firebird-system rollout status deployment/cloudnative-firebird-operator --timeout=180s
      - name: Apply the example (with the images built above)
        run: |
          mkdir -p ci-overlay
          cat > ci-overlay/kustomization.yaml <<'YAML'
          resources: ["../deploy/k8s-operator"]
          images:
            - { name: ghcr.io/mariuz/fbadmin, newName: fbadmin, newTag: ci }  # loaded into kind above
          YAML
          kubectl apply -k ci-overlay
          for _ in $(seq 1 60); do kubectl -n fbadmin-demo get pod fbcluster-0 >/dev/null 2>&1 && break; sleep 5; done
          kubectl -n fbadmin-demo wait pod/fbcluster-0 --for=condition=Ready --timeout=300s
          kubectl -n fbadmin-demo rollout status deployment/fbadmin --timeout=180s
      - name: fbadmin manages the operator's cluster
        run: |
          kubectl -n fbadmin-demo port-forward svc/fbadmin 5050:80 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5050/api/health && break; sleep 1; done
          python3 - <<'PY'
          import json, time, urllib.request
          B = "http://127.0.0.1:5050"
          def req(m, p, body=None):
              r = urllib.request.Request(B + p, method=m, data=json.dumps(body).encode() if body is not None else None,
                                         headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(r, timeout=60) as f:
                  return json.loads(f.read() or b"null")
          srv = req("GET", "/api/servers")[0]
          assert srv["id"] == "cfg-fbcluster-primary" and srv["password_known"], srv
          print("connect:", req("POST", f"/api/servers/{srv['id']}/connect", {}))
          base = f"/api/servers/{srv['id']}/databases/{srv['databases'][0]['id']}"
          r = req("POST", base + "/execute", {"sql": "CREATE TABLE K8S_DEMO (ID INTEGER PRIMARY KEY, NOTE VARCHAR(40));"
                                                     " INSERT INTO K8S_DEMO VALUES (1, 'managed by the operator');"})
          assert r["error"] is None, r["error"]
          rows = req("GET", base + "/tables/K8S_DEMO/data")["rows"]
          assert rows == [[1, "managed by the operator"]], rows
          print("ok:", rows)
          PY
      - name: The Kubernetes page manages the cluster (/api/kubernetes)
        run: |
          kubectl -n fbadmin-demo port-forward svc/fbadmin 5051:80 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5051/api/health && break; sleep 1; done
          python3 - <<'PY'
          import json, subprocess, time, urllib.error, urllib.request
          B = "http://127.0.0.1:5051"
          def req(m, p, body=None):
              r = urllib.request.Request(B + p, method=m, data=json.dumps(body).encode() if body is not None else None,
                                         headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as f:
                      return json.loads(f.read() or b"null")
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"{m} {p}: {e.code} {e.read().decode()}")
          def until(what, fn, timeout=300):
              end = time.time() + timeout
              while time.time() < end:
                  v = fn()
                  if v:
                      return v
                  time.sleep(3)
              raise SystemExit(f"timed out waiting for {what}")
          st = req("GET", "/api/kubernetes/status")
          assert st["enabled"] and st["operator"] and st["namespaces"] == ["fbadmin-demo"], st
          [c] = req("GET", "/api/kubernetes/clusters")
          assert (c["namespace"], c["name"], c["instances"]) == ("fbadmin-demo", "fbcluster", 1), c
          K = "/api/kubernetes/clusters/fbadmin-demo/fbcluster"
          d = req("GET", K)
          assert [p["name"] for p in d["pods"]] == ["fbcluster-0"] and d["pods"][0]["role"] == "primary", d["pods"]
          print("logs:", req("GET", K + "/logs?pod=fbcluster-0&tail=5")["text"][-300:])
          reg = req("POST", K + "/register", {})
          assert reg["server_id"] == "k8s-fbadmin-demo-fbcluster" and reg["password_from_secret"], reg
          sid = reg["server_id"]
          print("register:", reg)
          b = req("POST", K + "/backups", {"type": "logical"})["name"]
          bk = until(f"backup {b}", lambda: next((x for x in req("GET", K)["backups"]
                                                  if x["name"] == b and x["phase"] in ("Completed", "Failed")), None))
          assert bk["phase"] == "Completed", bk
          print("backup:", bk)
          r = req("POST", K + "/restores", {"backup": b, "target": "restored.fdb"})
          phase = lambda: subprocess.run(["kubectl", "-n", "fbadmin-demo", "get", "firebirdrestore", r["name"], "-o",
                                          "jsonpath={.status.phase}"], capture_output=True, text=True).stdout
          ph = until(f"restore {r['name']}", lambda: phase() in ("Completed", "Failed") and phase())
          assert ph == "Completed", ph
          db = req("POST", f"/api/servers/{sid}/databases", {"name": "restored", "path": "/var/lib/firebird/data/restored.fdb"})
          req("POST", f"/api/servers/{sid}/connect", {})
          rows = req("GET", f"/api/servers/{sid}/databases/{db['id']}/tables/K8S_DEMO/data")["rows"]
          assert rows == [[1, "managed by the operator"]], rows
          print("restored:", rows)
          PY
      - name: Hibernate and wake up through fbadmin
        run: |
          kubectl -n fbadmin-demo port-forward svc/fbadmin 5052:80 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5052/api/health && break; sleep 1; done
          api() { curl -fsS -X POST -H 'Content-Type: application/json' -d "$2" "http://127.0.0.1:5052/api/kubernetes/clusters/fbadmin-demo/fbcluster/$1"; echo; }
          api hibernate '{"on": true}'
          kubectl -n fbadmin-demo wait pod/fbcluster-0 --for=delete --timeout=180s
          curl -fsS http://127.0.0.1:5052/api/kubernetes/clusters | grep -q '"hibernated":true'
          api hibernate '{"on": false}'
          for _ in $(seq 1 60); do kubectl -n fbadmin-demo get pod fbcluster-0 >/dev/null 2>&1 && break; sleep 5; done
          kubectl -n fbadmin-demo wait pod/fbcluster-0 --for=condition=Ready --timeout=300s
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all -A
          kubectl -n fbadmin-demo describe pods
          kubectl -n fbadmin-demo logs deployment/fbadmin --tail=100 || true
          kubectl -n cloudnative-firebird-system logs deployment --all-containers --tail=200 || true

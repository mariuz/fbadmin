# Desktop app (pywebview shell + PyInstaller) for Windows, macOS and Linux.
#   Windows: zipped one-folder build + MSI (WiX)
#   macOS:   fbadmin.app in a .dmg (arm64 and x86_64)
#   Linux:   AppImage, .deb and .rpm (fpm), Flatpak bundle
# The Windows/macOS/Linux builds bundle the Firebird embedded engine for local databases
# (packaging/embedded/fetch-embedded.py, docs/EMBEDDED.md); the Flatpak does not (yet).
# Runs on release tags (artifacts are attached to the GitHub Release) and by hand.
# The builds are not code-signed; see docs/PACKAGING.md.
name: Desktop app

on:
  push:
    tags: ["v*"]
    # also build (and smoke-test the installers) when packaging changes on main; only tags publish
    branches: [main]
    paths:
      - packaging/**
      - backend/fbadmin/desktop.py
      - backend/fbadmin/updater.py
      - backend/fbadmin/embedded.py
      - backend/fbadmin/native.py
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - packaging/**
      - backend/fbadmin/desktop.py
      - backend/fbadmin/embedded.py
      - backend/fbadmin/native.py
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, kind: windows, fb: windows-x64 }
          - { name: macOS arm64, os: macos-14, kind: macos, arch: arm64, fb: macos-arm64 }
          - { name: macOS x86_64, os: macos-15-intel, kind: macos, arch: x86_64, fb: macos-x64 }
          # 22.04 keeps the glibc baseline low so the AppImage runs on older distributions.
          - { name: Linux x86_64, os: ubuntu-22.04, kind: linux, fb: linux-x64 }
    # Code signing turns on when these repository secrets exist (see docs/PACKAGING.md, "Signing");
    # without them the builds are unsigned, as before.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}            # base64 of a Developer ID Application .p12
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}  # "Developer ID Application: Name (TEAMID)"
      APPLE_ID: ${{ secrets.APPLE_ID }}                        # notarization (app-specific password)
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}        # base64 of an Authenticode .pfx
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('backend/fbadmin/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Build the web UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Linux build dependencies (WebKitGTK, PyGObject, fpm, rpm)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-0 rpm ruby-dev build-essential libtommath1
          sudo gem install --no-document fpm
          pip install "PyGObject<3.51" pycairo
      - name: Install fbadmin and PyInstaller
        # a prebuilt cryptography wheel (OpenSSL linked in statically): newer releases have no Intel
        # macOS wheel, and a source build links Homebrew's libssl while PyInstaller bundles another
        # one -> "Symbol not found: _SSL_get0_group_name" when the app starts
        # [native]: firebird-driver, which local (embedded) databases use
        run: pip install --only-binary cryptography "./backend[desktop,native]" pyinstaller pillow
      - name: Firebird embedded engine (local databases)
        # pinned release, SHA-256 checked; Linux takes libtommath.so.1 from the runner (libtommath1);
        # macOS adds @loader_path rpaths and re-signs ad hoc (signed for real below when configured)
        shell: bash
        run: python packaging/embedded/fetch-embedded.py --platform ${{ matrix.fb }} --dest build/firebird-embedded
      - name: PyInstaller
        env:
          FBADMIN_REQUIRE_EMBEDDED: "1"
        run: pyinstaller packaging/pyinstaller/fbadmin.spec --noconfirm

      # --- code signing (only with the secrets above) ------------------------------
      - name: Sign the app (macOS, Developer ID, hardened runtime)
        if: matrix.kind == 'macos' && env.MACOS_CERT_P12 != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          existing=(); while IFS= read -r k; do [ -n "$k" ] && existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"
          # --deep does not reach Mach-O files among the data (the bundled Firebird engine)
          find dist/fbadmin.app -path '*/firebird/*' -name '*.dylib' -type f -print0 \
            | xargs -0 -n1 codesign --force --timestamp --options runtime -s "$MACOS_SIGN_IDENTITY"
          codesign --force --deep --timestamp --options runtime \
            --entitlements packaging/macos/entitlements.plist -s "$MACOS_SIGN_IDENTITY" dist/fbadmin.app
          codesign --verify --deep --strict --verbose=2 dist/fbadmin.app
      - name: Sign the executable (Windows, Authenticode)
        if: matrix.kind == 'windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 dist\fbadmin\fbadmin.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa dist\fbadmin\fbadmin.exe
      - name: Unsigned build
        if: (matrix.kind == 'macos' && env.MACOS_CERT_P12 == '') || (matrix.kind == 'windows' && env.WINDOWS_CERT_PFX == '')
        run: echo "::notice::No signing certificate configured; the ${{ matrix.name }} packages are unsigned (see docs/PACKAGING.md, Signing)"

      # --- Windows: zip + MSI ---------------------------------------------------
      - name: Zip (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/packages | Out-Null
          Compress-Archive -Path dist/fbadmin -DestinationPath "dist/packages/fbadmin-${{ steps.v.outputs.version }}-windows-x64.zip"
      - name: MSI (Windows, WiX)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          # absolute SourceDir: WiX resolves Files paths relative to the .wxs, not the working directory;
          # -wx: an empty harvest is only a warning (WIX8601) and would produce an MSI without the app
          $src = (Resolve-Path dist\fbadmin).Path
          wix build packaging/windows/fbadmin.wxs -arch x64 -wx -d "SourceDir=$src" `
            -d Version=${{ steps.v.outputs.version }} -o "dist/packages/fbadmin-${{ steps.v.outputs.version }}-x64.msi"
          Remove-Item dist/packages/*.wixpdb -ErrorAction SilentlyContinue   # debug symbols, not a release asset
          if ($env:WINDOWS_CERT_PFX) {
            & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist/packages/*.msi).FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item "$env:RUNNER_TEMP\cert.pfx"
          }

      # --- macOS: dmg -------------------------------------------------------------
      - name: DMG (macOS)
        if: matrix.kind == 'macos'
        run: |
          mkdir -p dist/packages dmg
          cp -R dist/fbadmin.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners (the system is still
          # scanning the new files): retry a few times
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname fbadmin -srcfolder dmg -ov -format UDZO \
                 "dist/packages/fbadmin-${{ steps.v.outputs.version }}-macos-${{ matrix.arch }}.dmg"; then
              break
            fi
            [ "$attempt" = 5 ] && exit 1
            echo "hdiutil failed (attempt $attempt), retrying"; sleep $((attempt * 5))
          done
      - name: Sign and notarize the dmg (macOS)
        if: matrix.kind == 'macos' && env.MACOS_CERT_P12 != '' && env.APPLE_ID != ''
        run: |
          set -- dist/packages/*.dmg; dmg=$1
          codesign --force --timestamp -s "$MACOS_SIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      # --- Linux: AppImage, deb, rpm ---------------------------------------------
      - name: AppImage, deb, rpm (Linux)
        if: matrix.kind == 'linux'
        run: packaging/linux/build-packages.sh "${{ steps.v.outputs.version }}" appimage deb rpm

      - name: Smoke test (frozen app serves the UI)
        if: matrix.kind != 'macos'
        shell: bash
        run: |
          exe=dist/fbadmin/fbadmin; [ -f dist/fbadmin/fbadmin.exe ] && exe=dist/fbadmin/fbadmin.exe
          FBADMIN_DATA_DIR="$RUNNER_TEMP/fbadmin" BROWSER=true "$exe" --browser --port 5106 > frozen.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:5106/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:5106/ | grep -q 'id="root"'
          # the driver patches must apply in the frozen build too (they read firebirdsql's source)
          if grep -q "could not patch" frozen.log; then cat frozen.log; exit 1; fi
      - name: Smoke test local (embedded) databases in the frozen app
        # required on every platform: passed on Windows, macOS arm64/x86_64 and Linux in CI
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "${{ matrix.kind }}" = macos ]; then exe=dist/fbadmin.app/Contents/MacOS/fbadmin
          elif [ -f dist/fbadmin/fbadmin.exe ]; then exe=dist/fbadmin/fbadmin.exe; else exe=dist/fbadmin/fbadmin; fi
          FBADMIN_DATA_DIR="$RUNNER_TEMP/fbemb" BROWSER=true "$exe" --browser --port 5109 > embedded.log 2>&1 &
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:5109/api/health && break; sleep 1; done
          python packaging/embedded/smoke-test.py http://127.0.0.1:5109 "$RUNNER_TEMP/fbemb-dbs" \
            || { cat embedded.log; kill %1 || true; exit 1; }
          kill %1 || true
      # --- install the packages and start the installed app ------------------------
      - name: Install the MSI and run the installed app (Windows)
        if: matrix.kind == 'windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/packages/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; exit $p.ExitCode }
          $exe = "$env:ProgramFiles\fbadmin\fbadmin.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          $env:FBADMIN_DATA_DIR = "$env:RUNNER_TEMP\fbmsi"
          $env:BROWSER = "none"
          $app = Start-Process $exe -ArgumentList "--browser --port 5107" -PassThru -RedirectStandardOutput app.log -RedirectStandardError app.err
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:5107/api/health | Out-Null; break } catch { Start-Sleep 1 } }
          (Invoke-WebRequest http://127.0.0.1:5107/ -UseBasicParsing).Content | Select-String 'id="root"' | Out-Null
          if (-not $?) { Get-Content app.log, app.err -ErrorAction SilentlyContinue; throw "UI not served" }
          if (Select-String -Path app.err -Pattern "could not patch" -Quiet) { Get-Content app.err; throw "driver patch failed" }
          # stop the app before uninstalling, or msiexec waits for the files in use
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process fbadmin -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          Write-Host "uninstall exit $($p.ExitCode)"
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
      - name: Mount the dmg and run the app (macOS)
        if: matrix.kind == 'macos'
        run: |
          set -- dist/packages/*.dmg; dmg=$1
          hdiutil attach "$dmg" -mountpoint /Volumes/fbadmin -nobrowse
          FBADMIN_DATA_DIR="$RUNNER_TEMP/fbdmg" BROWSER=true /Volumes/fbadmin/fbadmin.app/Contents/MacOS/fbadmin --browser --port 5107 > dmg-app.log 2>&1 &
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:5107/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:5107/ | grep -q 'id="root"' || { cat dmg-app.log; exit 1; }
          if grep -q "could not patch" dmg-app.log; then cat dmg-app.log; exit 1; fi
          kill %1 || true
          hdiutil detach /Volumes/fbadmin || true
      - name: Install the deb, run the AppImage, inspect the rpm (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get install -y ./dist/packages/fbadmin_*.deb
          FBADMIN_DATA_DIR="$RUNNER_TEMP/fbdeb" BROWSER=true fbadmin-desktop --browser --port 5107 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:5107/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:5107/ | grep -q 'id="root"'
          kill %1 || true
          set -- dist/packages/*.AppImage; app=$1; chmod +x "$app"
          FBADMIN_DATA_DIR="$RUNNER_TEMP/fbai" BROWSER=true APPIMAGE_EXTRACT_AND_RUN=1 "$app" --browser --port 5108 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:5108/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:5108/api/version | grep -q '"version"'
          kill %2 || true
          rpm -qip dist/packages/*.rpm && rpm -qlp dist/packages/*.rpm | grep -q /opt/fbadmin/fbadmin
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.kind }}-${{ matrix.arch || 'x64' }}
          path: dist/packages/*
          if-no-files-found: error

  flatpak:
    name: Flatpak (Linux x86_64)
    runs-on: ubuntu-latest
    # the GNOME SDK image with flatpak-builder; the manifest pip-installs the wheel (network at build time)
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wheel with the built UI
        run: |
          python3 -m pip install --break-system-packages build >/dev/null 2>&1 || python3 -m pip install build
          scripts/build-dist.sh
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fbadmin.flatpak
          manifest-path: packaging/flatpak/io.github.mariuz.fbadmin.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Name the bundle like the other packages
        run: |
          v="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || v="0.0.0-dev"
          mkdir -p flatpak-out && cp fbadmin.flatpak "flatpak-out/fbadmin-${v}-x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-flatpak-x64
          path: flatpak-out/*

  attach:
    name: Attach to the GitHub Release
    needs: [build, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true
      # the desktop app's auto-updater refuses packages without a published checksum
      - name: SHA256SUMS
        working-directory: packages
        run: sha256sum fbadmin-* fbadmin_* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*

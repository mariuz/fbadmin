name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Firebird ${{ matrix.firebird }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firebird: ["3", "4", "5", "6-snapshot"]
        include:  # a newer server for the upgrade assistant's cross-version trial restore
          - { firebird: "3", next: "5" }
          - { firebird: "4", next: "5" }
          - { firebird: "5", next: "6-snapshot" }
    # Firebird 6 is pre-release: report, but do not fail the build
    continue-on-error: ${{ matrix.firebird == '6-snapshot' }}
    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3050:3050
      firebird_next:
        # an empty image (Firebird 6, no newer version) skips this service
        image: ${{ matrix.next && format('firebirdsql/firebird:{0}', matrix.next) || '' }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3057:3050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend
      - name: Wait for Firebird
        run: for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/3050) 2>/dev/null && break; sleep 1; done
      # events need a reachable RemoteAuxPort: a second container with a fixed, published aux port
      # (the service above keeps the default random one, for the "unreachable" test)
      - name: Firebird with a fixed RemoteAuxPort (event monitor tests)
        shell: bash
        run: scripts/events-test-server.sh "${FB_VERSION%%-*}" | sed -n 's/^export //p' >> "$GITHUB_ENV"
        env:
          FB_VERSION: ${{ matrix.firebird }}
      # includes the hypothesis fuzz tests of the SQL splitter and the generated-schema DDL round trips
      - name: Wait for the newer Firebird (upgrade trial restore)
        if: matrix.next
        run: for _ in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/3057) 2>/dev/null && break; sleep 1; done
      # the pure Python driver, forced. The ubuntu-26.04 runner image ships libfbclient2 (a Firebird 4
      # client), so the default setting (auto) picks the native driver here, as it does for users on
      # Ubuntu 25.04+/Debian 13: test_driver_auto.py checks that (it ignores FBADMIN_DRIVER)
      - run: pytest -q backend/tests
        env:
          FBADMIN_TEST_DIR: /var/lib/firebird/data
          FBADMIN_TEST_UPGRADE_PORT: ${{ matrix.next && '3057' || '' }}
          FBADMIN_DRIVER: firebirdsql
          FBADMIN_TEST_EXPECT_DRIVER: native
      - name: Local databases (Firebird 5 embedded engine, no server)
        if: matrix.firebird == '5'
        run: |
          PYTHON=python scripts/embedded-test-setup.sh "$RUNNER_TEMP/firebird-embedded"
          # as in the desktop app: the embedded engine's client library is the process's libfbclient
          # from the start (the runner's system libfbclient2 must not be loaded first)
          FBADMIN_EMBEDDED_DIR="$RUNNER_TEMP/firebird-embedded" FBADMIN_TEST_EMBEDDED_DIR="$RUNNER_TEMP/firebird-embedded" \
            pytest -q backend/tests/test_embedded.py -rs

  backend-native:
    # The whole backend suite again with the native driver (firebird-driver + libfbclient), which
    # local databases rely on. The client library is the Firebird 5 one from the pinned, SHA-256
    # checked embedded file set (a Firebird 3 client, e.g. Ubuntu 24.04's libfbclient2, cannot
    # handle INT128/DECFLOAT/time zones). test_driver_equivalence.py compares both drivers result by
    # result; test_driver_auto.py checks that the default setting (auto, FBADMIN_DRIVER unset in
    # that test) resolves to native with this client and that it negotiates ChaCha wire encryption.
    # One more run uses the system client (Ubuntu's libfbclient2, a Firebird 4 client) against a
    # Firebird 5 server, as on Ubuntu 25.04+/Debian 13 hosts: service options newer than the client
    # (e.g. parallel workers) must be refused cleanly, not sent (maintenance/ops.py engine_major).
    name: Backend tests (native driver, Firebird ${{ matrix.firebird }}${{ matrix.client == 'system' && ', system Firebird 4 client' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firebird: ["3", "4", "5", "6-snapshot"]
        client: ["bundled"]
        include:
          - { firebird: "5", client: "system" }
    continue-on-error: ${{ matrix.firebird == '6-snapshot' }}
    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev,native]"  # [native]: the compatibility alias (now empty)
      - name: Cache the Firebird release archive (SHA-256 pinned in fetch-embedded.py)
        uses: actions/cache@v4
        with:
          path: /tmp/fbadmin-embedded-cache
          key: firebird-embedded-linux-x64-${{ hashFiles('packaging/embedded/fetch-embedded.py') }}
      - name: Firebird 5 client library (embedded file set)
        if: matrix.client == 'bundled'
        run: PYTHON=python scripts/embedded-test-setup.sh "$RUNNER_TEMP/firebird-embedded"
      - name: System client library (Ubuntu's libfbclient2)
        if: matrix.client == 'system'
        run: |
          sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libfbclient2
          dpkg -s libfbclient2 | grep "^Version"
      - name: Wait for Firebird
        run: for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/3050) 2>/dev/null && break; sleep 1; done
      - name: Firebird with a fixed RemoteAuxPort (event monitor tests)
        shell: bash
        run: scripts/events-test-server.sh "${FB_VERSION%%-*}" | sed -n 's/^export //p' >> "$GITHUB_ENV"
        env:
          FB_VERSION: ${{ matrix.firebird }}
      - run: pytest -q backend/tests -rs
        env:
          FBADMIN_TEST_DIR: /var/lib/firebird/data
          FBADMIN_DRIVER: native
          FBADMIN_FBCLIENT: ${{ matrix.client == 'bundled' && format('{0}/firebird-embedded/lib/libfbclient.so.2', runner.temp) || '' }}
          FBADMIN_TEST_EXPECT_DRIVER: native

  integrations:
    name: Real services (crypt plugin, OpenLDAP, Dex OIDC)
    runs-on: ubuntu-latest
    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev,ldap]"
      - name: Firebird 5 with the sample database crypt plugin (port 3055)
        run: scripts/crypt-test-server.sh
      - name: OpenLDAP (slapd, port 3389)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends slapd ldap-utils
          sudo systemctl stop slapd || true
          # Ubuntu's AppArmor profile keeps slapd out of the temporary directory used below
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd 2>/dev/null || true
          scripts/ldap-test-server.sh
      - name: Dex OpenID Connect provider (port 5556)
        run: scripts/oidc-test-server.sh
      - run: pytest -q backend/tests/test_encryption_plugin.py backend/tests/test_ldap_real.py backend/tests/test_oidc_real.py -rs
        env:
          FBADMIN_TEST_DIR: /var/lib/firebird/data
          FBADMIN_TEST_CRYPT_PORT: "3055"
          FBADMIN_TEST_LDAP_URL: ldap://127.0.0.1:3389
          FBADMIN_TEST_OIDC_ISSUER: http://127.0.0.1:5556/dex

  storage:
    name: Cloud storage and alerts (SeaweedFS S3, Azurite, fake-gcs-server, Mailpit SMTP)
    runs-on: ubuntu-latest
    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      # the emulators need command-line arguments and a config file, so they are started by the
      # script (not as service containers); its "export NAME=value" lines go to $GITHUB_ENV
      - name: Start the storage emulators
        shell: bash
        run: scripts/storage-test-servers.sh | sed -n 's/^export //p' >> "$GITHUB_ENV"
        env:
          S3_IMAGE: chrislusf/seaweedfs:latest
          AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:latest
          GCS_IMAGE: fsouza/fake-gcs-server:latest
      - name: Start the SMTP server (Mailpit)
        shell: bash
        run: scripts/smtp-test-server.sh | sed -n 's/^export //p' | tr ' ' '\n' >> "$GITHUB_ENV"
      - name: Storage and alert tests
        run: |
          test -n "$FBADMIN_TEST_S3_ENDPOINT" && test -n "$FBADMIN_TEST_AZURE_ENDPOINT" && test -n "$FBADMIN_TEST_GCS_ENDPOINT"
          test -n "$FBADMIN_TEST_SMTP_HOST"
          pytest -q backend/tests/test_storage.py backend/tests/test_storage_real.py backend/tests/test_alerts.py -rs
        env:
          FBADMIN_TEST_DIR: /var/lib/firebird/data
      - name: Emulator logs
        if: failure()
        run: for c in fbs3 fbazurite fbgcs fbadmin-mailpit; do echo "== $c"; docker logs --tail 100 "$c" 2>&1; done

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"  # 22.18+ runs TypeScript test files without flags
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # unit tests of pure modules (query builder SQL, chart data shaping); node --test runs .ts directly
      - run: npm test
        working-directory: frontend
      # every t("…") string must be in all locale catalogs, translated
      - run: npm run i18n:check
        working-directory: frontend

  api-types:
    name: API types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - run: npm ci
        working-directory: frontend
      - run: scripts/gen-api-types.sh --check
        env:
          PYTHON: python

  wheel:
    name: Wheel with bundled UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install build
      - run: scripts/build-dist.sh
      - run: scripts/smoke-wheel.sh dist/*.whl 5106
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  e2e:
    name: End-to-end (Playwright, Firebird 5, ${{ matrix.driver }} driver)
    # Playwright does not support Ubuntu 26.04 (the current ubuntu-latest) yet
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # auto: the default setting, which resolves to native with the embedded file set's Firebird 5
        # client (FBADMIN_EMBEDDED_DIR below), as for desktop and Docker users; firebirdsql: the pure
        # Python driver forced. driver.spec.ts also switches to native explicitly and back.
        driver: [auto, firebirdsql]
    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
        ports:
          - 3050:3050
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: pip install -e backend
      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Firebird embedded engine (local databases spec)
        run: PYTHON=python scripts/embedded-test-setup.sh "$RUNNER_TEMP/firebird-embedded"
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Wait for Firebird
        run: for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/3050) 2>/dev/null && break; sleep 1; done
      - name: Firebird 5 with a fixed RemoteAuxPort (event monitor)
        run: scripts/events-test-server.sh 5
      - name: Run the e2e tests
        working-directory: e2e
        run: FBADMIN_EMBEDDED_DIR="$RUNNER_TEMP/firebird-embedded" npx playwright test
        env:
          FBADMIN_PYTHON: python
          FB_DB_DIR: /var/lib/firebird/data
          FB_EVENTS_PORT: "3060"
          FBADMIN_DRIVER: ${{ matrix.driver == 'firebirdsql' && 'firebirdsql' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.driver }}
          path: |
            e2e/playwright-report/
            e2e/test-results/

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/fbadmin
      - run: helm template t deploy/helm/fbadmin --set serverMode.enabled=true --set ingress.enabled=true > /dev/null
      - name: Kubernetes page RBAC (release namespace, listed namespaces, cluster-wide, read-only)
        run: |
          # count of Role, RoleBinding, ClusterRole, ClusterRoleBinding documents
          kinds() {
            out=$(helm template t deploy/helm/fbadmin -n fb "$@")
            for k in Role RoleBinding ClusterRole ClusterRoleBinding; do grep -c "^kind: $k\$" <<<"$out" || true; done | paste -sd,
          }
          test "$(kinds --set kubernetes.enabled=true)" = 1,1,0,0
          test "$(kinds --set kubernetes.enabled=true --set 'kubernetes.namespaces={a,b}')" = 2,2,0,0
          test "$(kinds --set kubernetes.enabled=true --set 'kubernetes.namespaces={*}')" = 0,0,1,1
          test "$(kinds)" = 0,0,0,0
          helm template t deploy/helm/fbadmin --set kubernetes.enabled=true --set kubernetes.manage=false | grep -q 'verbs: \[get, list\]'
          helm template t deploy/helm/fbadmin --set kubernetes.enabled=true | grep -q 'automountServiceAccountToken: true'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fbadmin:ci .
